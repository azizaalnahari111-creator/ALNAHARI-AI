<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALNAHARI AI - Creative Studio</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px;
  border-bottom: 1px solid #292929;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #d9ad55;
  font-size: 23px;
  font-weight: bold;
  letter-spacing: 1px;
}

.logo span {
  color: white;
}

header button {
  background: transparent;
  color: #d9ad55;
  border: 1px solid #d9ad55;
  padding: 9px 15px;
  border-radius: 8px;
}

.hero {
  text-align: center;
  padding: 65px 15px 35px;
}

.hero h1 {
  font-size: 36px;
  color: #e3bb6b;
  margin-bottom: 15px;
}

.hero p {
  color: #aaa;
  line-height: 1.7;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

.tools {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.card {
  background: #171717;
  border: 1px solid #333;
  border-radius: 13px;
  padding: 23px 12px;
  text-align: center;
  cursor: pointer;
}

.card:hover {
  border-color: #d9ad55;
}

.icon {
  font-size: 30px;
  margin-bottom: 12px;
}

.card h3 {
  color: #e3bb6b;
  font-size: 15px;
}

.generator {
  margin-top: 35px;
  background: #171717;
  border: 1px solid #333;
  padding: 22px;
  border-radius: 15px;
}

.generator h2 {
  color: #e3bb6b;
  margin-bottom: 18px;
}

textarea {
  width: 100%;
  height: 120px;
  background: #090909;
  color: white;
  border: 1px solid #444;
  border-radius: 10px;
  padding: 15px;
  font-size: 15px;
  resize: vertical;
}

select, input[type="file"] {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  background: #090909;
  color: white;
  border: 1px solid #444;
  border-radius: 8px;
}

.generate {
  width: 100%;
  margin-top: 18px;
  padding: 16px;
  background: linear-gradient(90deg,#b78a36,#f0ce80);
  color: #111;
  border: none;
  border-radius: 9px;
  font-size: 17px;
  font-weight: bold;
}

#preview {
  max-width: 100%;
  margin-top: 15px;
  border-radius: 10px;
  display: none;
}

footer {
  text-align: center;
  padding: 35px 10px;
  color: #777;
  font-size: 13px;
}

@media(max-width:450px) {
  .hero h1 {font-size: 29px;}
}
</style>
</head>

<body>

<header>
  <div class="logo">ALNAHARI <span>AI</span></div>
  <button>Creative Studio</button>
</header>

<section class="hero">
  <h1>Imagine. Create. Inspire.</h1>
  <p>Your personal AI studio for creating amazing images<br>
  and cinematic videos.</p>
</section>

<div class="container">

  <div class="tools">

    <div class="card" onclick="choose('video')">
      <div class="icon">🎬</div>
      <h3>Text to Video</h3>
    </div>

    <div class="card" onclick="choose('imagevideo')">
      <div class="icon">🎞️</div>
      <h3>Image to Video</h3>
    </div>

    <div class="card" onclick="choose('image')">
      <div class="icon">🎨</div>
      <h3>AI Image Generator</h3>
    </div>

    <div class="card" onclick="choose('edit')">
      <div class="icon">✨</div>
      <h3>AI Image Editor</h3>
    </div>

  </div>

  <div class="generator">

    <h2 id="title">AI Creative Studio</h2>

    <textarea id="prompt"
    placeholder="Describe what you want to create..."></textarea>

    <input type="file" id="upload"
    accept="image/*" onchange="showPreview(event)">

    <img id="preview">

    <select id="quality">
      <option>Standard Quality</option>
      <option>High Quality</option>
      <option>Ultra Quality</option>
    </select>

    <button class="generate" onclick="generate()">
      ✨ Generate with ALNAHARI AI
    </button>

    <p id="message" style="color:#d9ad55;margin-top:15px;text-align:center;"></p>

  </div>

</div>

<footer>
  ALNAHARI AI © 2026<br><br>
  Powered by Imagination
</footer>

<script>

let mode = "video";

function choose(type) {
  mode = type;

  let titles = {
    video: "Text to Video Generator",
    imagevideo: "Image to Video Generator",
    image: "AI Image Generator",
    edit: "AI Image Editor"
  };

  document.getElementById("title").innerText = titles[type];

  document.getElementById("message").innerText =
  "Selected: " + titles[type];
}

function showPreview(event) {
  const file = event.target.files[0];
  if (!file) return;

  const preview = document.getElementById("preview");
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
}

function generate() {
  const prompt = document.getElementById("prompt").value;

  if (!prompt.trim()) {
    alert("Please enter your description first.");
    return;
  }

  document.getElementById("message").innerText =
  "Your ALNAHARI AI studio is ready for its AI engine integration!";
}

</script>

</body>
      </html>
